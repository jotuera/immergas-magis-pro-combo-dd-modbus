# Immergas Magis Pro / Combo D+/D- emulator - package "zones23"
# Zones 2 and 3 (emulated panels 0x2A / 0x2B): setpoints, levels, climates, sources, status.
# Part of jotuera/immergas-magis-pro-combo-dd-modbus (MIT). Loaded by the main YAML through `packages:`.

switch:
  - platform: template
    name: "Immergas - Emulate Panel Zone 2"
    id: dd_emulate_2a_switch
    icon: mdi:robot
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(dd_emulate_2a_diag);
    turn_on_action:
      - lambda: |-
          // v107 SAFETY: a physical device answers on 0x2A (connected) -> do NOT enable emulation
          // (two devices on the same address = bus collision).
          if (id(dd_last_2a_read_ms) != 0 && (millis() - id(dd_last_2a_read_ms)) < 30000) {
            ESP_LOGE("dd_mode", "BEZPIECZNIK: fizyczny panel Strefy 2 0x2A wykryty (polaczono) - NIE wlaczam emulacji.");
            id(dd_emulate_2a_diag) = false;
            id(dd_emulate_2a_switch).publish_state(false);
            return;
          }
          id(dd_emulate_2a_diag) = true;
          id(dd_emulate_33_diag) = false;  // v94: panel aktywny => Dominus zbedny
          ESP_LOGW("dd_mode", "v85 EMULACJA panelu Strefy 2 addr 42/0x2A - flaga ON (backend serwowania 0x2A do zrobienia)");
    turn_off_action:
      - lambda: |-
          id(dd_emulate_2a_diag) = false;
          id(dd_last_2a_read_ms) = 0;  // v107: reset polaczenia
          ESP_LOGW("dd_mode", "v85 EMULACJA Strefy 2 addr 42 wylaczona");

  - platform: template
    name: "Immergas - Emulate Panel Zone 3"
    id: dd_emulate_2b_switch
    icon: mdi:robot
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(dd_emulate_2b_diag);
    turn_on_action:
      - lambda: |-
          // v107 SAFETY: a physical device answers on 0x2B (connected) -> do NOT enable emulation
          // (two devices on the same address = bus collision).
          if (id(dd_last_2b_read_ms) != 0 && (millis() - id(dd_last_2b_read_ms)) < 30000) {
            ESP_LOGE("dd_mode", "BEZPIECZNIK: fizyczny panel Strefy 3 0x2B wykryty (polaczono) - NIE wlaczam emulacji.");
            id(dd_emulate_2b_diag) = false;
            id(dd_emulate_2b_switch).publish_state(false);
            return;
          }
          id(dd_emulate_2b_diag) = true;
          id(dd_emulate_33_diag) = false;  // v94: panel aktywny => Dominus zbedny
          ESP_LOGW("dd_mode", "v85 EMULACJA panelu Strefy 3 addr 43/0x2B - flaga ON (backend serwowania 0x2B do zrobienia)");
    turn_off_action:
      - lambda: |-
          id(dd_emulate_2b_diag) = false;
          id(dd_last_2b_read_ms) = 0;  // v107: reset polaczenia
          ESP_LOGW("dd_mode", "v85 EMULACJA Strefy 3 addr 43 wylaczona");

number:
  # v96: ZONE 2/3 - CH setpoint + offset. Placeholders (the boiler reads zones 2/3 only in a multi-zone
  # setup A13; the 0x2A/0x2B serving backend doesn't exist yet). Sliders set the global + sync the thermostat.
  - platform: template
    name: "Immergas - CH Setpoint Zone 2"
    id: zone2_setpoint_number
    icon: mdi:home-thermometer
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 35
    step: 0.5
    mode: slider
    optimistic: false
    lambda: |-
      if (!id(dd_emulate_2a_diag)) return NAN;
      return id(zone2_setpoint_raw) / 10.0f;
    set_action:
      - lambda: |-
          id(zone2_setpoint_raw) = (int) round(x * 10.0f);
