text_sensor:
  # v96: Zone 2 operating phase (Comfort/Eco/Manual) from dd_zone2_status_raw. Placeholder - the boiler writes
  # zone 2 status only in a multi-zone setup (A13); with no data shows "—".
  - platform: template
    name: "Immergas - Zone 2 phase (Comfort-Eco)"
    id: dd_zone2_phase_text
    icon: mdi:home-thermometer
    update_interval: 10s
    lambda: |-
      if (!id(dd_emulate_2a_diag)) return std::string("—");
      int lb = id(dd_zone2_status_raw) & 0xFF;
      if (lb & 0x40) return std::string("Comfort");
      if (lb & 0x80) return std::string("Eco");
      if (lb & 0x04) return std::string("Manual");
      return std::string("—");

  # v96: Zone 3 operating phase (Comfort/Eco/Manual) from dd_zone3_status_raw. Placeholder like Zone 2.
  - platform: template
    name: "Immergas - Zone 3 phase (Comfort-Eco)"
    id: dd_zone3_phase_text
    icon: mdi:home-thermometer
    update_interval: 10s
    lambda: |-
      if (!id(dd_emulate_2b_diag)) return std::string("—");
      int lb = id(dd_zone3_status_raw) & 0xFF;
      if (lb & 0x40) return std::string("Comfort");
      if (lb & 0x80) return std::string("Eco");
      if (lb & 0x04) return std::string("Manual");
      return std::string("—");

binary_sensor:
  - platform: template
    name: "Immergas - Connection Panel Zone 2"
    id: bs_panel2_online
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      if (id(dd_last_2a_read_ms) == 0) return false;
      return (millis() - id(dd_last_2a_read_ms)) < 30000;

