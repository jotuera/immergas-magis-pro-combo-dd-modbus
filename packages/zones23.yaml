select:
  # v100: switchable 5-option temp/humidity sources for Zone 2 and 3 (Panel/Basement/Ground floor/Upper floor/Whole house), default Panel.
  - platform: template
    name: "Immergas - Temperature source Zone 2"
    id: temp_source_z2_select
    icon: mdi:thermometer
    optimistic: true
    entity_category: config
    options:
      - "Panel"
      - "Basement"
      - "Ground floor"
      - "Upper floor"
      - "Whole house"
    initial_option: "Panel"
    set_action:
      - lambda: |-
          int idx = 1;
          if (x == "Basement") idx = 2;
          else if (x == "Ground floor") idx = 3;
          else if (x == "Upper floor") idx = 4;
          else if (x == "Whole house") idx = 5;
          id(temp_src_z2_idx) = idx;
          switch (idx) {
            case 1: id(ha_room_temp_2_raw) = id(ha_temp_raw_z2_1); break;
            case 2: id(ha_room_temp_2_raw) = id(ha_temp_raw_z2_2); break;
            case 3: id(ha_room_temp_2_raw) = id(ha_temp_raw_z2_3); break;
            case 4: id(ha_room_temp_2_raw) = id(ha_temp_raw_z2_4); break;
            case 5: id(ha_room_temp_2_raw) = id(ha_temp_raw_z2_5); break;
