sensor:
  # v101: HA sources for Zone 2/3 (slots 2-5). Slot 1 "Panel" NOT from HA - real PDU 2005/2006 of the panel
  # 0x2A/0x2B (handle_pdu -> ha_temp/hum_raw_z2/z3_1). Each writes its buffer; the active one (idx) -> output.
  - platform: homeassistant
    id: ha_temp_in_z2_2
    entity_id: ${temp_src_z2_2}
    internal: true
    on_value:
      - lambda: |-
          if (!std::isnan(x)) { id(ha_temp_raw_z2_2) = (int) roundf(x * 10.0f);
            if (id(temp_src_z2_idx) == 2) id(ha_room_temp_2_raw) = id(ha_temp_raw_z2_2); }
  - platform: homeassistant
    id: ha_temp_in_z2_3
