climate:
  # Zone 2/3: same model. Current temperature = the zone's room value (NAN when that zone's panel emulation
  # is OFF); phase/request from 2010 written to 0x2A/0x2B (multi-zone setups only, A13).
  - platform: bus_climate
    name: "Immergas - Thermostat Zone 2 (CH)"
    id: co_thermostat_2
    icon: mdi:radiator
    update_interval: 2s
    supported_modes: [HEAT, COOL]
    visual:
      min_temperature: 5
      max_temperature: 35
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    current_temperature_lambda: |-
      if (!id(dd_emulate_2a_diag) || id(ha_room_temp_2_raw) <= 0) return NAN;
      return id(ha_room_temp_2_raw) / 10.0f;
    target_temperature_lambda: |-
      return id(zone2_setpoint_raw) / 10.0f;
    mode_lambda: |-
      switch (id(operating_mode_reported)) {
        case 3: return climate::CLIMATE_MODE_HEAT;
        case 2: return climate::CLIMATE_MODE_COOL;
        default: return climate::CLIMATE_MODE_OFF;
      }
    action_lambda: |-
      int m = id(operating_mode_reported);
      if (m != 2 && m != 3) return climate::CLIMATE_ACTION_OFF;
      if ((id(dd_zone2_status_raw) & 0x08) == 0) return climate::CLIMATE_ACTION_IDLE;
      return (m == 3) ? climate::CLIMATE_ACTION_HEATING : climate::CLIMATE_ACTION_COOLING;
    set_target_temperature_action:
      - lambda: |-
          id(zone2_setpoint_number).make_call().set_value(x).perform();
    supported_presets: [COMFORT, ECO, NONE]
    preset_lambda: |-
      int st = id(dd_zone2_status_raw) & 0xFF;
      if (st & 0x40) return std::string("COMFORT");
      if (st & 0x80) return std::string("ECO");
      if (st & 0x04) return std::string("NONE");
      return {};
    set_preset_action:
      - lambda: |-
          bool cool = (id(operating_mode_reported) == 2);
          int raw;
          if (x == "COMFORT") raw = cool ? id(dominus_comfort_cool_z2_raw) : id(dominus_comfort_heat_z2_raw);
          else if (x == "ECO") raw = cool ? id(dominus_eco_cool_z2_raw) : id(dominus_eco_heat_z2_raw);
          else return;
          id(zone2_setpoint_number).make_call().set_value(raw / 10.0f).perform();

