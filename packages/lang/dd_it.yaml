# Immergas Magis Pro / Combo D+/D- emulator - language file (dd_): Italian
# Entity names (n_*) and texts shown in Home Assistant (t_*). Pick ONE dd_ language file in the packages list.
# Changing the language renames the entities: Home Assistant then creates new entities (history stays on the old ones).
# Entity names are still in English - translations welcome (see TRANSLATING.md). Texts (t_*) and fault texts are Italian.

