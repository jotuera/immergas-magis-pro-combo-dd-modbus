# Immergas Magis Pro / Combo D+/D- emulator - package "dominus"
# Dominus / panel settings: Comfort/Eco levels, humidity, Set Flow, operating mode, time programs,
# room probe modulation, dew point correction, A31, time-program state.
# Part of jotuera/immergas-magis-pro-combo-dd-modbus (MIT). Loaded by the main YAML through `packages:`.

switch:
  # v1.3.0: 0x29 6107 - setpoint correction by dew point calculation (read by the boiler from the panel)
  - platform: template
    name: "Immergas - Dew point correction"
    id: sw_punkt_rosy
    icon: mdi:water-thermometer-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  # ------------------------------------------------------------
  # Dominus - "Manage Zone" screen
  # ------------------------------------------------------------
  - platform: template
    name: "Immergas - Set Comfort Heat Zone 1"
    id: number_dominus_comfort_heat
    icon: mdi:fire
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 35
    step: 0.1
    mode: slider
    optimistic: false
    lambda: |-
      return id(dominus_comfort_heat_raw) / 10.0f;
    set_action:
      - lambda: |-
          lww::local_write(lww::COMFORT_HEAT, id(dominus_comfort_heat_raw), (int) round(x * 10.0f));
          id(dominus_comfort_heat_raw) = (int) round(x * 10.0f);
          ESP_LOGW("dd_control", "Zlecono Set Comfort Heat %.1f°C raw=%d", x, id(dominus_comfort_heat_raw));
          id(number_dominus_comfort_heat).publish_state(x);  // v61: natychmiastowy update suwaka

  - platform: template
    name: "Immergas - Set Eco Heat Zone 1"
    id: number_dominus_eco_heat
    icon: mdi:leaf
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 35
    step: 0.1
    mode: slider
    optimistic: false
    lambda: |-
      return id(dominus_eco_heat_raw) / 10.0f;
    set_action:
      - lambda: |-
          lww::local_write(lww::ECO_HEAT, id(dominus_eco_heat_raw), (int) round(x * 10.0f));
          id(dominus_eco_heat_raw) = (int) round(x * 10.0f);
          ESP_LOGW("dd_control", "Zlecono Set Eco Heat %.1f°C raw=%d", x, id(dominus_eco_heat_raw));
          id(number_dominus_eco_heat).publish_state(x);  // v61: natychmiastowy update suwaka

  - platform: template
    name: "Immergas - Set Comfort Cool Zone 1"
    id: number_dominus_comfort_cool
    icon: mdi:snowflake
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 35
    step: 0.1
    mode: slider
    optimistic: false
    lambda: |-
      return id(dominus_comfort_cool_raw) / 10.0f;
    set_action:
      - lambda: |-
          lww::local_write(lww::COMFORT_COOL, id(dominus_comfort_cool_raw), (int) round(x * 10.0f));
          id(dominus_comfort_cool_raw) = (int) round(x * 10.0f);
          ESP_LOGW("dd_control", "Zlecono Set Comfort Cool %.1f°C raw=%d", x, id(dominus_comfort_cool_raw));
          id(number_dominus_comfort_cool).publish_state(x);  // v61: natychmiastowy update suwaka

  - platform: template
    name: "Immergas - Set Eco Cool Zone 1"
    id: number_dominus_eco_cool
    icon: mdi:snowflake-thermometer
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 35
    step: 0.1
    mode: slider
    optimistic: false
    lambda: |-
      return id(dominus_eco_cool_raw) / 10.0f;
    set_action:
      - lambda: |-
          lww::local_write(lww::ECO_COOL, id(dominus_eco_cool_raw), (int) round(x * 10.0f));
          id(dominus_eco_cool_raw) = (int) round(x * 10.0f);
          ESP_LOGW("dd_control", "Zlecono Set Eco Cool %.1f°C raw=%d", x, id(dominus_eco_cool_raw));
          id(number_dominus_eco_cool).publish_state(x);  // v61: natychmiastowy update suwaka

  - platform: template
    name: "Immergas - U07 Humidity setting zone 1"
    id: number_dominus_humidity
    icon: mdi:water-percent
    unit_of_measurement: "%"
    min_value: 30
    max_value: 90
    step: 1
    mode: slider
    optimistic: false
    lambda: |-
      return id(dominus_humidity_raw);
    set_action:
      - lambda: |-
          lww::local_write(lww::HUMIDITY, id(dominus_humidity_raw), (int) round(x));
          id(dominus_humidity_raw) = (int) round(x);
          ESP_LOGW("dd_control", "Zlecono Set Umidity %.0f%% raw=%d", x, id(dominus_humidity_raw));
          id(number_dominus_humidity).publish_state(x);  // v61: natychmiastowy update suwaka

  - platform: template
