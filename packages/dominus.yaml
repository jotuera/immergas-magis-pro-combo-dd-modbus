select:
  # v1.3.0: 0x29 2294 - time programs active (read by the boiler from the panel; zones 2/3 inherit it)
  - platform: template
    name: "Immergas - Time programs Zone 1"
    id: sel_programy_czasowe
    icon: mdi:calendar-clock
    optimistic: true
    restore_value: true
    options:
      - "Manual"
      - "Auto"
    initial_option: "Manual"
  # v1.3.0: 0x29 6105 - modulation with the room probe (panel Service menu -> Zone definition)
  - platform: template
    name: "Immergas - Room probe modulation"
    id: sel_modulacja_sonda
    icon: mdi:home-thermometer-outline
    optimistic: true
    restore_value: true
    options:
      - "NO"
      - "YES"
    initial_option: "NO"
  - platform: template
    name: "Immergas - System operating mode"
    id: operating_mode_select
    icon: mdi:state-machine
    # v60: optimistic MUSI byc false bo jest lambda (ESPHome: "optimistic cannot be used with
    # lambda"). Instant-feedback robimy przez publish_state(x) w set_action ponizej.
    optimistic: false
    options:
      - "Standby"
      - "Summer DHW"
      - "Cooling"
      - "Winter CH+DHW"
    lambda: |-
      switch (id(operating_mode_raw)) {
        case 0: return std::string("Standby");
        case 1: return std::string("Summer DHW");
        case 2: return std::string("Cooling");
        case 3: return std::string("Winter CH+DHW");
        default: return std::string("Winter CH+DHW");
      }
    set_action:
      - lambda: |-
          int mode = 3;
          if (x == "Standby") {
            mode = 0;
          } else if (x == "Summer DHW") {
            mode = 1;
          } else if (x == "Cooling") {
            mode = 2;
          } else if (x == "Winter CH+DHW") {
            mode = 3;
          }

          // v57 MODE CONTROL (passive, as Dominus): we set the REQUESTED mode, which
          // the emulator returns on READ 2000. The boiler reads and applies it. No active writing.
          // The command stays pending until the boiler confirms it (lww_guard.h); afterwards a mode changed on the
          // panel is adopted again (before: after the first HA choice the panel could no longer change the mode).
          lww::local_write(lww::OPERATING_MODE, id(operating_mode_raw), mode);
          id(operating_mode_raw) = mode;
          id(operating_mode_target_raw) = mode;

          // v59/v60: natychmiastowe odswiezenie w HA (bez czekania na poll) - select + sensor.
          id(operating_mode_select).publish_state(x);

          ESP_LOGW("dd_control", "v59 STEROWANIE TRYBEM: zadany %s -> %d. Emulator zwraca to na READ 2000, piec zastosuje (~1.85s).", x.c_str(), mode);

# v1.2.0: reset the sniffer map = new baseline (e.g. before clicking through panel options).

text_sensor:
  # v1.3.0 decoded zone-panel registers (0x29)
  - platform: template
    name: "Immergas - A31 Zone 1 room thermostat"
    id: panel_a31_termostat
    icon: mdi:thermostat
    update_interval: never
  - platform: template
    name: "Immergas - Time program state (boiler)"
    id: piec_stan_programu
    icon: mdi:calendar-check
    update_interval: never
