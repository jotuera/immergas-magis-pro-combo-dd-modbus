# Immergas Magis Pro / Combo D+/D- emulator - package "dd_heat_pump"
# Heat pump via the outdoor-unit interface board (0x1E, Samsung MIM): temperatures, compressor, fan, EEV,
# run flags, stage, firmware, night function U11, system flow/return.
# Part of jotuera/immergas-magis-pro-combo-dd-modbus (MIT). Loaded by the main YAML through `packages:`.
# File and id names start with dd_ so this repo can be combined with the T-/T+ and F1/F2 repos on one device.

sensor:
  # Space-heating/cooling flow and return = heat-pump water probes TW2/TW1 (0x1E W21/W20), published only while
  # they measure the system circuit: winter or cooling mode, zone request (2010 bit3), no DHW request (2001 bit0,
  # 3-way valve on the cylinder) and compressor running. Otherwise they measure the DHW circuit or stagnant water
  # -> unknown (gap in the HA graph). TW2 verified against the boiler display D20 (Magis Combo V2, fw 5.03).
  - platform: template
    name: "${n_dd_system_flow_temp}"
    id: dd_system_flow_temp
    icon: mdi:thermometer-chevron-up
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      int m = id(dd_operating_mode_reported);
      bool space = (m == 2 || m == 3) && (id(dd_zone1_status_raw) & 0x08) != 0;
      if (!space || id(dd_piec_zadanie_cwu_oczek).state || !id(dd_pc_sprezarka_pracuje).state) return NAN;
      return id(dd_sniff_1e_w_21).state;
  - platform: template
    name: "${n_dd_system_return_temp}"
    id: dd_system_return_temp
    icon: mdi:thermometer-chevron-down
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      int m = id(dd_operating_mode_reported);
      bool space = (m == 2 || m == 3) && (id(dd_zone1_status_raw) & 0x08) != 0;
      if (!space || id(dd_piec_zadanie_cwu_oczek).state || !id(dd_pc_sprezarka_pracuje).state) return NAN;
      return id(dd_sniff_1e_w_20).state;
  - platform: template
    name: "${n_dd_system_delta_t}"
    id: dd_system_delta_t
    icon: mdi:delta
    state_class: measurement
    unit_of_measurement: "K"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      int m = id(dd_operating_mode_reported);
      bool space = (m == 2 || m == 3) && (id(dd_zone1_status_raw) & 0x08) != 0;
      if (!space || id(dd_piec_zadanie_cwu_oczek).state || !id(dd_pc_sprezarka_pracuje).state) return NAN;
      return id(dd_sniff_1e_w_21).state - id(dd_sniff_1e_w_20).state;  // > 0 heating, < 0 cooling
  # v1.2.0 heat pump via the outdoor-unit interface board (0x1E, Samsung MIM). Verified on 3 buses (D+/D-, T-/T+, NASA F1/F2).
  # 0x1E I3
  - platform: template
    name: "${n_dd_sniff_1e_i_3}"
    id: dd_sniff_1e_i_3
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E I4
  - platform: template
    name: "${n_dd_sniff_1e_i_4}"
    id: dd_sniff_1e_i_4
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E I5 (the boiler forwards it as 3002)
  - platform: template
    name: "${n_dd_sniff_1e_i_5}"
    id: dd_sniff_1e_i_5
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E I6
  - platform: template
    name: "${n_dd_sniff_1e_i_6}"
    id: dd_sniff_1e_i_6
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E I17
  - platform: template
    name: "${n_dd_sniff_1e_i_17}"
    id: dd_sniff_1e_i_17
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E I10 = water target sent to the HP (= D04 on demand, 5.0 idle)
  - platform: template
    name: "${n_dd_sniff_1e_i_10}"
    id: dd_sniff_1e_i_10
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E W20 = boiler -> HP (the outdoor unit has no water probes)
  - platform: template
    name: "${n_dd_sniff_1e_w_20}"
    id: dd_sniff_1e_w_20
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E W21
  - platform: template
    name: "${n_dd_sniff_1e_w_21}"
    id: dd_sniff_1e_w_21
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # 0x1E W22
  - platform: template
    name: "${n_dd_sniff_1e_w_22}"
    id: dd_sniff_1e_w_22
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "${n_dd_sniff_1e_i_11}"
    id: dd_sniff_1e_i_11
    icon: mdi:sine-wave
    device_class: frequency
    state_class: measurement
    unit_of_measurement: "Hz"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "${n_dd_sniff_1e_i_13}"
    id: dd_sniff_1e_i_13
    icon: mdi:current-ac
    device_class: current
    state_class: measurement
    unit_of_measurement: "A"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "${n_dd_sniff_1e_i_14}"
    id: dd_sniff_1e_i_14
    icon: mdi:fan
    state_class: measurement
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "${n_dd_sniff_1e_i_16}"
    id: dd_sniff_1e_i_16
    icon: mdi:valve
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  # v1.3.1: compressor capacity limit in % (0x1E input 12 = MIM echo of the boiler write to reg 2; 0 -> 100 %)
  - platform: template
    name: "${n_dd_sniff_1e_i_12}"
    id: dd_sniff_1e_i_12
    icon: mdi:speedometer-slow
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    name: "${n_dd_pc_etap_pracy}"
    id: dd_pc_etap_pracy
