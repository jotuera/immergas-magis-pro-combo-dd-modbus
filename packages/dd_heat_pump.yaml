binary_sensor:
  # v1.2.0 heat-pump run flags (0x1E, published from handle_pdu)
  - platform: template
    name: "${n_dd_pc_zlecenie_pracy}"
    id: dd_pc_zlecenie_pracy
    icon: mdi:power
  # v1.3.1: night function U11 active (0x1E input 12 != 0) - compressor limited inside the U12-U13 window
  - platform: template
    name: "${n_dd_pc_funkcja_nocna}"
    id: dd_pc_funkcja_nocna
    icon: mdi:weather-night
  - platform: template
    name: "${n_dd_pc_zlecenie_przyjete}"
    id: dd_pc_zlecenie_przyjete
    icon: mdi:check-circle-outline
  - platform: template
    name: "${n_dd_pc_sprezarka_pracuje}"
    id: dd_pc_sprezarka_pracuje
    icon: mdi:heat-pump
    device_class: running
  - platform: template
    name: "${n_dd_pc_wentylator_pracuje}"
    id: dd_pc_wentylator_pracuje
    icon: mdi:fan
    device_class: running
