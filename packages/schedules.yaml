    optimistic: true
    restore_value: true
    entity_category: config
    options:
      - "Calendar 1"
      - "Calendar 2"
      - "Calendar 3"
      - "Calendar 4"
    initial_option: "Calendar 1"
  # v70: shortcut - set the SAME profile for all 7 days at once (per-day still works independently).
  # "(select)" = stan neutralny, nic nie robi.
  - platform: template
    name: "Immergas - CH Schedule all days Zone 1"
    id: sel_weekday_all
    icon: mdi:calendar-multiselect
    optimistic: true
    entity_category: config
    options:
      - "(select)"
      - "Calendar 1"
      - "Calendar 2"
      - "Calendar 3"
      - "Calendar 4"
    initial_option: "(select)"
    set_action:
      - lambda: |-
          if (x == "(select)") return;
          id(sel_weekday_1).make_call().set_option(x).perform();
          id(sel_weekday_2).make_call().set_option(x).perform();
          id(sel_weekday_3).make_call().set_option(x).perform();
          id(sel_weekday_4).make_call().set_option(x).perform();
          id(sel_weekday_5).make_call().set_option(x).perform();
          id(sel_weekday_6).make_call().set_option(x).perform();
          id(sel_weekday_7).make_call().set_option(x).perform();
          ESP_LOGW("dd_chrono", "v70 Wszystkie dni Strefy 1 -> %s", x.c_str());
  # v106: assign a calendar to a day - Zone 2 (0x2A, reg. 2420-2426) and Zone 3 (0x2B, 2430-2436).
