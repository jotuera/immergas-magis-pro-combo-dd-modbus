    name: "${n_sel_weekday_1}"
    id: sel_weekday_1
    icon: mdi:calendar-today
    optimistic: true
    restore_value: true
    entity_category: config
    options:
      - "${t_cal1}"
      - "${t_cal2}"
      - "${t_cal3}"
      - "${t_cal4}"
    initial_option: "${t_cal1}"
  - platform: template
