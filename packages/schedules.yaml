# Immergas Magis Pro / Combo D+/D- emulator - package "schedules"
# Weekly schedules: calendars 1-4 (4 ranges each) and day -> calendar for zones 1-3 and DHW.
# Part of jotuera/immergas-magis-pro-combo-dd-modbus (MIT). Loaded by the main YAML through `packages:`.

datetime:
  # v70: Zone 1 schedule - 4 daily profiles (cal1-4), each with 4 ranges (start/end).
  # Read by the emulator on 0x33/0x29 (registers 2310-2347). HH:MM time-picker in HA.
  # optimistic+restore: state kept locally (flash), no time source needed.
  - platform: template
    name: "${n_dt_cal1_f1_on}"
    id: dt_cal1_f1_on
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"
    entity_category: config
    icon: mdi:clock-start
  - platform: template
    name: "${n_dt_cal1_f1_off}"
