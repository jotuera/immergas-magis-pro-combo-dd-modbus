    entity_category: config
    options:
      - "${t_select}"
      - "${t_cal1}"
      - "${t_cal2}"
      - "${t_cal3}"
      - "${t_cal4}"
    initial_option: "${t_select}"
    set_action:
      - lambda: |-
          if (x == "${t_select}") return;
          id(sel_dhw_weekday_1).make_call().set_option(x).perform();
          id(sel_dhw_weekday_2).make_call().set_option(x).perform();
          id(sel_dhw_weekday_3).make_call().set_option(x).perform();
          id(sel_dhw_weekday_4).make_call().set_option(x).perform();
          id(sel_dhw_weekday_5).make_call().set_option(x).perform();
          id(sel_dhw_weekday_6).make_call().set_option(x).perform();
          id(sel_dhw_weekday_7).make_call().set_option(x).perform();
          ESP_LOGW("dd_chrono", "v83 CWU: wszystkie dni -> %s", x.c_str());
