  # v70: assign a profile (Cal 1-4) to a weekday - Zone 1 (registers 2410-2416).
  - platform: template
    name: "Immergas - CH Schedule Monday Zone 1"
    id: sel_weekday_1
    icon: mdi:calendar-today
    optimistic: true
    restore_value: true
    entity_category: config
    options:
      - "Calendar 1"
      - "Calendar 2"
