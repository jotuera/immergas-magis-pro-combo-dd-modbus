# Immergas Magis Pro / Combo D+/D- emulator - package "core"
# Base: project info, components from GitHub, logger, debug, HA time, RS485 UART (pins via substitutions).
# Part of jotuera/immergas-magis-pro-combo-dd-modbus (MIT). Loaded by the main YAML through `packages:`.

substitutions:
  author: "JoTu"
  github_url: "https://github.com/jotuera/immergas-magis-pro-combo-dd-modbus"
  project_version: "1.5.0"
  # RS485 pins (M5Stack Atom + RS485 unit). Override in your main YAML if your wiring differs.
  uart_tx_pin: GPIO26
  uart_rx_pin: GPIO32
  uart_de_pin: GPIO23

esphome:
  comment: "Immergas Dominus/Panel (D+/D-) emulator | author: ${author} | ${github_url}"
  project:
    name: "jotuera.immergas-magis-pro-combo-dd-modbus"
    version: "${project_version}"
  on_boot:
    priority: 800
    then:
      - lambda: |-
          // RS485 DE (GPIO23) is driven by the UART hardware (uart: flow_control_pin), not from here.
          ESP_LOGW("dd_rs485", "RS485 hardware DE on GPIO23; Dominus 0x33 + panels + thermostats + chrono + faults + status ready, fw ${project_version}");

# Components of this project, downloaded from GitHub (nothing to copy next to this YAML):
#   bus_climate - climate entities backed by the bus state
#   immergas_dd - shared helpers for the lambdas (HA/bus arbitration, fault texts)
# @v1.5.0 = this release; @main = latest development version.

external_components:
  - source: github://jotuera/immergas-magis-pro-combo-dd-modbus@v1.5.0
    components: [bus_climate, immergas_dd]
    refresh: 1d

immergas_dd:

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  # INFO in normal use (DEBUG logs every bus frame); switch to DEBUG only for bus sniffing sessions.
  level: INFO
  baud_rate: 0

# Runtime diagnostics (reset reason, loop time, free heap): tell a reboot or a blocked loop from an entity glitch.

debug:
  update_interval: 10s

# HA time, used only for the drift of the boiler clock (PDU 2300).

time:
  - platform: homeassistant
    id: ha_time

# v111: lokalny panel WWW (fallback gdy HA niedostepny; local:true = assety wbudowane, bez internetu).

uart:
  id: dd_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  # RS485 half-duplex in hardware (ESP-IDF UART_MODE_RS485_HALF_DUPLEX): the UART raises DE (RTS on GPIO23,
  # HIGH = TX) right before the start bit and drops it after the last stop bit. write_array() returns at once:
  # no flush()/busy-wait in the main loop. Previously DE was toggled in software with a 12/15 ms hold after
  # every reply (~25-40 ms of blocked loop per frame, a few hundred frames per minute).
  flow_control_pin: ${uart_de_pin}
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 1024
