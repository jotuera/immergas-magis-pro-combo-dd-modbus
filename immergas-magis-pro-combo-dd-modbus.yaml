    type: int
    restore_value: yes
    initial_value: '240'

  - id: dominus_eco_heat_raw
    type: int
    restore_value: yes
    initial_value: '200'

  - id: dominus_comfort_cool_raw
    type: int
    restore_value: yes
    initial_value: '230'

  - id: dominus_eco_cool_raw
    type: int
    restore_value: yes
    initial_value: '250'

  - id: dominus_humidity_raw
    type: int
    restore_value: yes
    initial_value: '51'

  - id: dominus_set_flow_raw
    type: int
    restore_value: yes
    initial_value: '300'

