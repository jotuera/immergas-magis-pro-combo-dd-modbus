  - id: dominus_eco_heat_z2_raw
    type: int
    restore_value: yes
    initial_value: '200'

  - id: dominus_comfort_cool_z2_raw
    type: int
    restore_value: yes
    initial_value: '230'

  - id: dominus_eco_cool_z2_raw
    type: int
    restore_value: yes
    initial_value: '250'

  - id: dominus_humidity_z2_raw
    type: int
    restore_value: yes
    initial_value: '51'

  - id: dominus_set_flow_z2_raw
    type: int
    restore_value: yes
    initial_value: '300'

  - id: dominus_comfort_heat_z3_raw
    type: int
    restore_value: yes
    initial_value: '240'

  - id: dominus_eco_heat_z3_raw
    type: int
    restore_value: yes
    initial_value: '200'

  - id: dominus_comfort_cool_z3_raw
    type: int
    restore_value: yes
    initial_value: '230'

  - id: dominus_eco_cool_z3_raw
    type: int
    restore_value: yes
    initial_value: '250'

  - id: dominus_humidity_z3_raw
    type: int
    restore_value: yes
    initial_value: '51'

  - id: dominus_set_flow_z3_raw
    type: int
    restore_value: yes
    initial_value: '300'

  # v117 last-writer-wins: last value seen on the bus. The capture adopts ONLY when value != last_bus
  # (a genuine change from the Dominus); on the boiler re-writing the same value it does NOT revert the
  # HA change -> the slider holds and the boiler reads/propagates it (like a real panel). -32768 sentinel.
  - id: zone1_setpoint_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: zone1_offset_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: dominus_comfort_heat_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: dominus_eco_heat_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: dominus_comfort_cool_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: dominus_eco_cool_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: dominus_humidity_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: dominus_set_flow_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: cwu_setpoint_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: zone2_setpoint_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: zone3_setpoint_last_bus
    type: int
    restore_value: no
    initial_value: '-32768'

  # v118 last-writer-wins delta-sync: last thermostat target we reconciled with 'raw'. The 1s loop sets
  # raw = thermostat ONLY when target != thermo_last (user REALLY moved the thermostat); otherwise raw
  # (slider/bus) is kept and the thermostat is best-effort synced. Initialized in the first loop tick.
  - id: zone1_thermo_last
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: cwu_thermo_last
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: zone2_thermo_last
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: zone3_thermo_last
