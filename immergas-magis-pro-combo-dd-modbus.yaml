    initial_value: '50'
  - id: ha_hum_raw_z3_2
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_z3_3
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_z3_4
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_temp_raw_z2_5
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_hum_raw_z2_5
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_temp_raw_z3_5
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_hum_raw_z3_5
    type: int
    restore_value: no
