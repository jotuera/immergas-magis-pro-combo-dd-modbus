switch:
  # v100: removed the 4 "Chrono: profile Cal 1..4" switches - misleading "activation" (in the app none of the 4
  # calendar is the main one; just assign a profile to each day with the CO selects below +
  # shortcut "all days -> profile"). Profile editors (datetime cal1-4) and day selects stay.

  # v68: "Discovery of new PDUs" removed - diagnostics belong to the sniffer (immergas-dd-sniffer v47).
  # v68: "Active commands" removed - old active write disabled since v57 (slave model).
  - platform: template
    name: "Immergas - Emulate Modbus"
    id: enable_replies_switch
    icon: mdi:lan-connect
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(dd_enable_replies);
    turn_on_action:
      - lambda: |-
          id(dd_enable_replies) = true;
          ESP_LOGW("dd_mode", "Polaczenie Modbus ON - pelny RX+TX na magistrali (dekodowanie + odpowiedzi).");
    turn_off_action:
      - lambda: |-
          id(dd_enable_replies) = false;
          // v104: "Emulate Modbus" is the MASTER - OFF disables all emulation (Dominus + zone panels).
          id(dd_emulate_33_diag) = false;
          id(dd_emulate_29_diag) = false;
          id(dd_emulate_2a_diag) = false;
          id(dd_emulate_2b_diag) = false;
          id(dd_emulate_33_switch).publish_state(false);
          id(dd_emulate_29_switch).publish_state(false);
          id(dd_emulate_2a_switch).publish_state(false);
          id(dd_emulate_2b_switch).publish_state(false);
          id(dd_last_33_read_ms) = 0;
          id(dd_last_29_read_ms) = 0;
          id(dd_last_2a_read_ms) = 0;
          id(dd_last_2b_read_ms) = 0;
          ESP_LOGW("dd_mode", "Emuluj Modbus OFF (master) - RX+TX off + zgaszone Dominus i panele stref 1/2/3.");

  # v90: two separate, MUTUALLY EXCLUSIVE emulation switches (emulate EITHER the Dominus OR
  # a panel - never both, since one is physical). Enabling one disables the other. Default: Dominus ON,
  # Zone 1 Panel OFF. "Modbus connection" is the master gate (default ON).
  - platform: template
    name: "Immergas - Emulate Dominus"
    id: dd_emulate_33_switch
    icon: mdi:robot-industrial
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(dd_emulate_33_diag);
    turn_on_action:
      - lambda: |-
          // v107 SAFETY: a physical device answers on 0x33 (connected) -> do NOT enable emulation
          // (two devices on the same address = bus collision).
          if (id(dd_last_33_read_ms) != 0 && (millis() - id(dd_last_33_read_ms)) < 30000) {
            ESP_LOGE("dd_mode", "BEZPIECZNIK: fizyczny Dominus 0x33 wykryty (polaczono) - NIE wlaczam emulacji.");
            id(dd_emulate_33_diag) = false;
            id(dd_emulate_33_switch).publish_state(false);
            return;
          }
          id(dd_emulate_33_diag) = true;
          id(dd_emulate_29_diag) = false;
          id(dd_emulate_2a_diag) = false;
          id(dd_emulate_2b_diag) = false;
          ESP_LOGW("dd_mode", "Emuluj DOMINUS 0x33 ON (panele OFF - wykluczenie)");
    turn_off_action:
      - lambda: |-
          id(dd_emulate_33_diag) = false;
          id(dd_last_33_read_ms) = 0;  // v107: reset -> "Connection" counts only physical replies from now on
          ESP_LOGW("dd_mode", "Emuluj Dominus 0x33 OFF");

  - platform: template
    name: "Immergas - Emulate Panel Zone 1"
    id: dd_emulate_29_switch
    icon: mdi:robot
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(dd_emulate_29_diag);
    turn_on_action:
      - lambda: |-
          // v107 SAFETY: a physical device answers on 0x29 (connected) -> do NOT enable emulation
          // (two devices on the same address = bus collision).
          if (id(dd_last_29_read_ms) != 0 && (millis() - id(dd_last_29_read_ms)) < 30000) {
            ESP_LOGE("dd_mode", "BEZPIECZNIK: fizyczny panel Strefy 1 0x29 wykryty (polaczono) - NIE wlaczam emulacji.");
            id(dd_emulate_29_diag) = false;
            id(dd_emulate_29_switch).publish_state(false);
            return;
          }
          id(dd_emulate_29_diag) = true;
          id(dd_emulate_33_diag) = false;
          ESP_LOGW("dd_mode", "Emuluj PANEL Strefy 1 0x29 ON (Dominus OFF - wykluczenie)");
    turn_off_action:
      - lambda: |-
          id(dd_emulate_29_diag) = false;
          id(dd_last_29_read_ms) = 0;  // v107: reset polaczenia
          ESP_LOGW("dd_mode", "Emuluj Panel Strefy 1 0x29 OFF");

  - platform: template
    name: "Immergas - Emulate Panel Zone 2"
    id: dd_emulate_2a_switch
    icon: mdi:robot
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(dd_emulate_2a_diag);
    turn_on_action:
      - lambda: |-
          // v107 SAFETY: a physical device answers on 0x2A (connected) -> do NOT enable emulation
          // (two devices on the same address = bus collision).
          if (id(dd_last_2a_read_ms) != 0 && (millis() - id(dd_last_2a_read_ms)) < 30000) {
            ESP_LOGE("dd_mode", "BEZPIECZNIK: fizyczny panel Strefy 2 0x2A wykryty (polaczono) - NIE wlaczam emulacji.");
            id(dd_emulate_2a_diag) = false;
            id(dd_emulate_2a_switch).publish_state(false);
            return;
          }
          id(dd_emulate_2a_diag) = true;
          id(dd_emulate_33_diag) = false;  // v94: panel aktywny => Dominus zbedny
          ESP_LOGW("dd_mode", "v85 EMULACJA panelu Strefy 2 addr 42/0x2A - flaga ON (backend serwowania 0x2A do zrobienia)");
    turn_off_action:
