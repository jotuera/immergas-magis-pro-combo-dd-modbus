number:
  # ------------------------------------------------------------
  # v57 DHW setpoint - control (the emulator returns it on READ 2095, the boiler applies it)
  # ------------------------------------------------------------
  - platform: template
    name: "Immergas - D05 DHW setpoint value"
    id: cwu_setpoint_number
    icon: mdi:water-thermometer
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 60
    step: 0.5
    mode: slider
    optimistic: false
    lambda: |-
      return id(cwu_setpoint_raw) / 10.0f;
    set_action:
      - lambda: |-
          id(cwu_setpoint_raw) = (int) round(x * 10.0f);
          ESP_LOGW("dd_control", "v57 STEROWANIE CWU: zadana %.1f stopni raw=%d. Emulator zwraca to na READ 2095.", x, id(cwu_setpoint_raw));
          id(cwu_setpoint_number).publish_state(x);  // v61: natychmiastowy update suwaka w HA
          id(cwu_thermostat).make_call().set_target_temperature_low(x).set_target_temperature(x).perform();  // v65: sync termostat

