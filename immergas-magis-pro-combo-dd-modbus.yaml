  # ------------------------------------------------------------
  # Bus / control
  # ------------------------------------------------------------
  - id: dd_last_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: dd_last_tx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: dd_last_crc_bad_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: dd_enable_replies
    type: bool
    restore_value: yes
    initial_value: 'true'

  # Diagnostic switches left from the old emulation.
  # In this version they do NOT enable bus replies, to avoid triggering E121/E142.
  - id: dd_emulate_29_diag
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: dd_emulate_33_diag
    type: bool
    restore_value: no
    initial_value: 'false'

  # v85: emulation flags for the Zone 2 (0x2A/42) and Zone 3 (0x2B/43) panels. NOTE: flags only -
  # backend serwowania rejestrow 0x2A/0x2B jeszcze NIE istnieje (do zrobienia jak dla 0x29).
  - id: dd_emulate_2a_diag
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: dd_emulate_2b_diag
    type: bool
    restore_value: no
    initial_value: 'false'

  # v66: time of the last READ (33 03 / 29 03) by the boiler = "online" signal (the boiler reads us).
  - id: dd_last_33_read_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: dd_last_29_read_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: dd_last_2a_read_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: dd_last_2b_read_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # v94: last 0x1E activity (addr 30, machine room ALWAYS present) = "Modbus connection" (bus alive).
  - id: dd_last_1e_read_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ------------------------------------------------------------
  # Main Zone 1 / DHW values
  # ------------------------------------------------------------
  - id: cwu_setpoint_raw
    type: int
    restore_value: yes
    initial_value: '500'

  - id: dhw_temp_raw
    type: int
    restore_value: no
    initial_value: '0'

  - id: outside_temp_raw
    type: int
    restore_value: no
    initial_value: '0'

  - id: zone1_temp_raw
    type: int
    restore_value: no
    initial_value: '0'

  - id: zone1_setpoint_raw
    type: int
    restore_value: yes
    initial_value: '210'

  - id: zone1_offset_raw
    type: int
    restore_value: yes
    initial_value: '20'

  # v96: CH setpoint + offset for Zone 2 and 3 (placeholders - 0x2A/0x2B serving backend TBD).
  - id: zone2_setpoint_raw
    type: int
    restore_value: yes
    initial_value: '210'
  - id: zone3_setpoint_raw
    type: int
    restore_value: yes
    initial_value: '210'
  - id: zone2_offset_raw
    type: int
    restore_value: yes
    initial_value: '20'
  - id: zone3_offset_raw
    type: int
    restore_value: yes
    initial_value: '20'

  - id: operating_mode_raw
    type: int
    restore_value: yes
    initial_value: '3'

  - id: operating_mode_target_raw
    type: int
    restore_value: yes
    initial_value: '3'

  # v57 MODE CONTROL: separates the requested mode (operating_mode_raw, returned on READ 2000)
  # from the reported mode (what the boiler WRITES BACK on 2000 - display only).
  - id: operating_mode_reported
    type: int
    restore_value: no
    initial_value: '3'

  # Until the user picks a mode in HA, the emulator MIRRORS the boiler's mode (state adoption,
  # no forcing at startup). After a choice, the emulator dictates the requested mode.
  - id: mode_user_set
    type: bool
    restore_value: no
    initial_value: 'false'

