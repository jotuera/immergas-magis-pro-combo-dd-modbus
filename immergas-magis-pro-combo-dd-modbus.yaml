# Immergas Magis Combo - Dominus / zone-panel emulator on the D+/D- Modbus bus (ESPHome, M5Stack Atom)
#
# Emulates the Immergas Dominus remote (0x33) and/or zone panels (0x29 / 0x2A / 0x2B) so a Magis Combo
# boiler can be controlled from Home Assistant without the proprietary Dominus. The boiler is the Modbus
# master; this device is a slave (9600 8E1). Feeds room temperature/humidity from HA sensors and exposes
# setpoints, weekly schedules, operating mode and boiler faults. See README.md for wiring, the register
# map and setup.
#
# Project : jotuera.immergas-magis-pro-combo-dd-modbus  |  v1.1.0
# Repo    : https://github.com/jotuera/immergas-magis-pro-combo-dd-modbus
# License : MIT (c) 2026 JoTu
# Tested  : Magis Combo V2 (MPROCOMBOV2). Other Immergas engines use different register maps - untested.
#
# Changelog:
#   v1.1.0 - Fix setpoints (CH/DHW) bouncing/reverting (e.g. CH Setpoint Zone 2 25<->21). Last-writer-wins:
#            the slider AND the climate now hold their value and adopt genuine boiler/Dominus changes.
#            Root cause: the 1s loop forced setpoint = thermostat unconditionally, and make_call() only set
#            target_temperature_low (a no-op on heat-only climates). Now: delta-sync loop + dual target setter.
#   v1.0.0 - Initial public release.

substitutions:
  # v64 HYBRID: 4 temp/humidity sources for the emulated panel 0x29 (Basement/Ground/Upper/House).
  # Pick the active source with a dropdown in HA. Default = Upper floor (3). Put your own entity_id.
  # v101: 5 sources for Zone 1: 1=Panel (REAL PDU 2005/2006 of the physical panel 0x29 - NOT from HA),
  # 2=Basement, 3=Ground floor, 4=Upper floor, 5=Whole house. Default Upper floor (idx 4). Sources 2-5 = HA entities:
  temp_src_2: sensor.srednia_temperatura_piwnica
  temp_src_3: input_number.srednia_temepratura_parter
  temp_src_4: sensor.srednia_temperatura_pietro
  temp_src_5: sensor.srednia_temperatura_dom
  hum_src_2: sensor.srednia_wilgotnosc_piwnica
  hum_src_3: sensor.srednia_wilgotnosc_parter
  hum_src_4: sensor.srednia_wilgotnosc_pietro
  hum_src_5: sensor.srednia_wilgotnosc_dom
  # v94: temp/humidity sources for Zone 2 and 3 (placeholder - put your own entity_id).
  # v101: temp/humidity sources for Zone 2/3. Slot 1 "Panel" = REAL PDU 2005/2006 of the physical panel
  # 0x2A/0x2B (not from HA); slots 2-5 = HA entities (put your own entity_id, dropdown picks the active one).
  temp_src_z2_2: sensor.temperatura_strefa_2_2
  temp_src_z2_3: sensor.temperatura_strefa_2_3
  temp_src_z2_4: sensor.temperatura_strefa_2_4
  hum_src_z2_2: sensor.wilgotnosc_strefa_2_2
  hum_src_z2_3: sensor.wilgotnosc_strefa_2_3
  hum_src_z2_4: sensor.wilgotnosc_strefa_2_4
  temp_src_z3_2: sensor.temperatura_strefa_3_2
  temp_src_z3_3: sensor.temperatura_strefa_3_3
  temp_src_z3_4: sensor.temperatura_strefa_3_4
  hum_src_z3_2: sensor.wilgotnosc_strefa_3_2
  hum_src_z3_3: sensor.wilgotnosc_strefa_3_3
  hum_src_z3_4: sensor.wilgotnosc_strefa_3_4
  temp_src_z2_5: sensor.temperatura_strefa_2_5
  hum_src_z2_5: sensor.wilgotnosc_strefa_2_5
  temp_src_z3_5: sensor.temperatura_strefa_3_5
  hum_src_z3_5: sensor.wilgotnosc_strefa_3_5

  # v110: project metadata (author / GitHub repo). After publishing, set the correct repo URL.
  author: "JoTu"
  github_url: "https://github.com/jotuera/immergas-magis-pro-combo-dd-modbus"
  project_version: "1.1.0"

esphome:
  name: immergas-dd-atom
  friendly_name: Immergas D+D- Atom
  comment: "Immergas Dominus/Panel (D+/D-) emulator | author: ${author} | ${github_url}"
  project:
    name: "jotuera.immergas-magis-pro-combo-dd-modbus"
    version: "${project_version}"
  on_boot:
    priority: 800
    then:
      - lambda: |-
          // v48: normalna polaryzacja DE/RE.
          // LOW = RX/idle, HIGH = TX.
          gpio_set_direction(GPIO_NUM_23, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_23, 0);
          ESP_LOGW("dd_rs485", "v75 RS485 DE GPIO23 LOW idle; Dominus 0x33 + panel 0x29 + termostaty + chrono S1 (selekty dni) + bledy + faza S1 + status (no-RAW lean) v113 keepalive ready");

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # v79: do NOT reboot the ESP when WiFi drops - bus emulation must run independently of the network.
  reboot_timeout: 0s
  # Optional static IP (default: DHCP). Uncomment and set to YOUR network:
  # manual_ip:
  #   static_ip: 192.168.1.42
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

# v79: do NOT reboot the ESP when HA crashes/disconnects (default 15 min -> boiler raised E142/E121
# while HA was down). The emulator keeps serving the bus with last-known values regardless of HA.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

# v111: lokalny panel WWW (fallback gdy HA niedostepny; local:true = assety wbudowane, bez internetu).
web_server:
  port: 80
  version: 3
  log: false
  local: true
  # v112: protect the web UI (this device controls the boiler). Add web_username/web_password to secrets.yaml.
  auth:
    username: !secret web_username
    password: !secret web_password

uart:
  id: dd_uart
  tx_pin: GPIO26
  rx_pin: GPIO32
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 1024

globals:
  # ------------------------------------------------------------
  # v62: room temperature/humidity from HA (for the emulated panel 0x29).
  # int: temp x10 (215 = 21.5C), humidity in % (50). Unavailable -> last known value.
  # ------------------------------------------------------------
  # v71: boiler fault monitoring. dd_err_code = last PDU 2100 (0=no fault),
  # dd_err_2101 = last PDU 2101 (reset/flags). Captured in handle_pdu from the bus.
  - id: dd_err_code
    type: int
    restore_value: no
    initial_value: '0'
  - id: dd_err_2101
    type: int
    restore_value: no
    initial_value: '0'
  # v73: Zone 1 status (PDU 2010, LB flag8). bit6=Comfort, bit7=Eco, bit2=Manual, bit3=heat request.
  - id: dd_zone1_status_raw
    type: int
    restore_value: no
    initial_value: '0'
  # v96: status/phase for Zone 2 and 3 (mirror of 2010). Placeholder - the boiler writes zone 2/3 status only
  # in a multi-zone setup (A13). With no source it stays 0 -> the phase shows "—".
  - id: dd_zone2_status_raw
    type: int
    restore_value: no
    initial_value: '0'
  - id: dd_zone3_status_raw
    type: int
    restore_value: no
    initial_value: '0'
  - id: ha_room_temp_raw
    type: int
    restore_value: yes
    initial_value: '210'

  - id: ha_room_humidity_raw
    type: int
    restore_value: yes
    initial_value: '50'

  # v94: temp/humidity for Zone 2 and 3 (from HA, for emulating panels 0x2A/0x2B). Placeholders.
  - id: ha_room_temp_2_raw
    type: int
    restore_value: yes
    initial_value: '210'
  - id: ha_room_temp_3_raw
    type: int
    restore_value: yes
    initial_value: '210'
  - id: ha_room_humidity_2_raw
    type: int
    restore_value: yes
    initial_value: '50'
  - id: ha_room_humidity_3_raw
    type: int
    restore_value: yes
    initial_value: '50'

  # v63: buffers for 3 sources + index of the selected source (1-3). ha_room_*_raw = selected (read by emu29).
  - id: ha_temp_raw_1
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_temp_raw_2
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_temp_raw_3
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_temp_raw_4
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_temp_raw_5
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_hum_raw_1
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_2
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_3
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_4
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_5
    type: int
    restore_value: no
    initial_value: '50'
  # v100: restore_value: no -> after reboot returns to source 4 (Upper floor), consistent with the select's initial_option.
  - id: temp_src_idx
    type: int
    restore_value: no
    initial_value: '4'
  - id: hum_src_idx
    type: int
    restore_value: no
    initial_value: '4'

  # v99: buffers for 4 temp/humidity sources of Zone 2 and 3 + active source index (1-4, restore:no -> after
  # reboot source 1). ha_room_temp/humidity_2/3_raw = selected (read by emu_zone_value for 0x2A/0x2B).
  - id: ha_temp_raw_z2_1
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_temp_raw_z2_2
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_temp_raw_z2_3
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_temp_raw_z2_4
    type: int
    restore_value: no
    initial_value: '210'
  - id: ha_hum_raw_z2_1
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_z2_2
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_z2_3
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_hum_raw_z2_4
    type: int
    restore_value: no
    initial_value: '50'
  - id: ha_temp_raw_z3_1
