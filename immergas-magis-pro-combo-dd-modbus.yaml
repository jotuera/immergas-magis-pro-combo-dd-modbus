  - platform: template
    name: "Immergas - System operating mode"
    id: operating_mode_select
    icon: mdi:state-machine
    # v60: optimistic MUSI byc false bo jest lambda (ESPHome: "optimistic cannot be used with
    # lambda"). Instant-feedback robimy przez publish_state(x) w set_action ponizej.
    optimistic: false
    options:
      - "Standby"
      - "Summer DHW"
      - "Cooling"
      - "Winter CH+DHW"
    lambda: |-
      switch (id(operating_mode_raw)) {
        case 0: return std::string("Standby");
        case 1: return std::string("Summer DHW");
        case 2: return std::string("Cooling");
        case 3: return std::string("Winter CH+DHW");
        default: return std::string("Winter CH+DHW");
      }
    set_action:
      - lambda: |-
          int mode = 3;
          if (x == "Standby") {
            mode = 0;
          } else if (x == "Summer DHW") {
            mode = 1;
          } else if (x == "Cooling") {
            mode = 2;
          } else if (x == "Winter CH+DHW") {
            mode = 3;
          }

          // v57 MODE CONTROL (passive, as Dominus): we set the REQUESTED mode, which
          // the emulator returns on READ 2000. The boiler reads and applies it. No active writing.
          // mode_user_set=true -> from now the emulator DICTATES the mode, ignoring the boiler's 2000 write-back.
          id(operating_mode_raw) = mode;
          id(operating_mode_target_raw) = mode;
          id(mode_user_set) = true;

          // v59/v60: natychmiastowe odswiezenie w HA (bez czekania na poll) - select + sensor.
          id(operating_mode_select).publish_state(x);

          ESP_LOGW("dd_control", "v59 STEROWANIE TRYBEM: zadany %s -> %d. Emulator zwraca to na READ 2000, piec zastosuje (~1.85s).", x.c_str(), mode);

